<template id="s5-template">
  <div data-composition-id="s5" data-width="1920" data-height="1080">
    <!--
      Scene 5 · The invitation. Local time; on the root it starts at 58.5 s, so every time here is
      the transcript time minus 58.5. The voice ends at 65.18 s (local 6.68); the closing card
      holds until 68.0 s so it can be read.

      The card carries the case's name, not its published headline: that headline says "the worst
      reception across all 10 genres", the overstatement scene 3 corrects (see guion.md). Until the
      case is corrected, closing on it would contradict the video itself.
    -->
    <div id="s5-questions">
      <p id="s5-q1" class="q">
        <span class="w" data-t="0.11">Which </span><span class="w" data-t="0.43">genres </span><span class="w" data-t="1.07">would </span><span class="w" data-t="1.23">I </span><span class="w" data-t="1.31">tell </span><span class="w" data-t="1.55">the </span><span class="w" data-t="1.63">fund </span><span class="w" data-t="2.11">to </span><span class="w" data-t="2.19">look </span><span class="w" data-t="2.35">at </span><span class="w hi" data-t="2.59">first?</span>
      </p>
      <p id="s5-q2" class="q">
        <span class="w" data-t="3.23">And </span><span class="w" data-t="3.55">what </span><span class="w no" data-t="3.95">can’t </span><span class="w" data-t="4.27">this </span><span class="w" data-t="4.51">data </span><span class="w" data-t="4.91">tell </span><span class="w" data-t="5.23">us?</span>
      </p>
    </div>

    <div id="s5-card">
      <p id="s5-kicker">Data analysis case study</p>
      <p id="s5-name">Price and reception on Steam</p>
      <p id="s5-meta">125,855 games · 2 sources · Python, pandas, matplotlib</p>
      <div id="s5-url"><span>Read the case</span><b>juanesportfolio.com/cases/steam-price-reception</b></div>
    </div>

    <style>
      [data-composition-id="s5"] .w { display: inline-block; white-space: pre; }
      [data-composition-id="s5"] #s5-questions { position: absolute; left: 128px; top: 300px; width: 1660px; }
      [data-composition-id="s5"] .q {
        font-size: 76px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.12;
        text-wrap: balance;   /* otherwise "first?" is left alone on the second line */
      }
      [data-composition-id="s5"] #s5-q2 { margin-top: 48px; }
      [data-composition-id="s5"] .hi { color: var(--acento); }
      [data-composition-id="s5"] .no { color: var(--contra); }

      [data-composition-id="s5"] #s5-card { position: absolute; left: 128px; top: 300px; width: 1660px; }
      [data-composition-id="s5"] #s5-kicker {
        font-size: 28px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tinta-suave);
      }
      [data-composition-id="s5"] #s5-name {
        margin-top: 18px; font-size: 104px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.02;
      }
      [data-composition-id="s5"] #s5-meta { margin-top: 26px; font-size: 30px; color: var(--tinta-suave); }
      [data-composition-id="s5"] #s5-url {
        margin-top: 72px; display: inline-flex; align-items: center; gap: 24px;
        padding: 22px 34px; border-radius: 16px; background: var(--acento); color: #fff;
      }
      [data-composition-id="s5"] #s5-url span { font-size: 28px; font-weight: 600; opacity: 0.9; }
      [data-composition-id="s5"] #s5-url b { font-size: 36px; letter-spacing: -0.01em; }
    </style>

    <script>
      (() => {
        const raiz = document.querySelector('[data-composition-id="s5"]');
        const $ = (sel) => raiz.querySelector(sel);
        const tl = gsap.timeline({ paused: true });

        // "Which genres would I tell the fund to look at first? And what can't this data tell us?"
        raiz.querySelectorAll(".w").forEach((w) => {
          tl.from(w, { opacity: 0, y: 22, duration: 0.35, ease: "power2.out" }, Number(w.dataset.t));
        });

        // "That's in the case." 5.63 → 6.68: the questions give way to the case itself.
        tl.to($("#s5-questions"), { opacity: 0, y: -50, duration: 0.4, ease: "power2.in" }, 5.6);
        tl.from($("#s5-kicker"), { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 5.95);
        tl.from($("#s5-name"), { opacity: 0, y: 28, duration: 0.5, ease: "power3.out" }, 6.05);
        tl.from($("#s5-meta"), { opacity: 0, duration: 0.4 }, 6.35);
        tl.from($("#s5-url"), { opacity: 0, y: 20, scale: 0.96, duration: 0.45, ease: "back.out(1.8)" }, 6.45);
        // The card then simply holds to the end (9.5): nothing moves while it is being read.

        window.__timelines = window.__timelines || {};
        window.__timelines["s5"] = tl;
      })();
    </script>
  </div>
</template>
