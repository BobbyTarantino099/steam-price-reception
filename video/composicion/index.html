<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Real rows and the inflation example, generated by video/datos_video.py. -->
    <script src="assets/datos.js"></script>
    <style>
      /* Same type and palette as the case figures (notebooks/estilo.py). */
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/Inter-Regular.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-SemiBold.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/Inter-Bold.ttf"); }

      :root {
        --acento: #1f5fa8;
        --contra: #c2410c;
        --contexto: #8a877c;
        --tinta: #1a1815;
        --tinta-suave: #5a564c;
        --tinta-tenue: #807d73;
        --regla: #e2e0d9;
        --papel: #ffffff;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--papel);
      }
      body { font-family: "Inter", sans-serif; color: var(--tinta); }

      .clip { position: absolute; inset: 0; }

      /* Signature, as on every figure. The id overrides the full-frame box of .clip. */
      #firma {
        inset: auto 64px 48px auto;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--tinta-tenue);
      }
    </style>
  </head>
  <body>
    <!--
      Scene cuts follow the recorded voice (composicion/transcript.json, from the spliced take):
      s1 0-8.7 · s2 8.7-31.1 · s3 31.1-41.4 · s4 41.4-58.5 · s5 58.5-65.18.
      The voice ends at 65.18 s; the root runs to 68.0 so the closing card of scene 5 can be read,
      over the music alone.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="68.0"
      data-width="1920"
      data-height="1080"
    >
      <!--
        Voice + music, one file: video/empalmar_voz.py (take + scene 3 and 4 fragments) →
        video/limpiar_voz.py → video/mezclar_audio.py (music bed ducked under the voice).
      -->
      <audio
        id="mezcla"
        src="mezcla.wav"
        data-start="0"
        data-duration="68.0"
        data-track-index="0"
        data-volume="1"
      ></audio>

      <div id="escena-1" class="clip" data-composition-id="s1" data-composition-src="compositions/s1.html"
           data-start="0" data-duration="8.7" data-track-index="1"></div>
      <div id="escena-2" class="clip" data-composition-id="s2" data-composition-src="compositions/s2.html"
           data-start="8.7" data-duration="22.4" data-track-index="1"></div>
      <div id="escena-3" class="clip" data-composition-id="s3" data-composition-src="compositions/s3.html"
           data-start="31.1" data-duration="10.3" data-track-index="1"></div>
      <div id="escena-4" class="clip" data-composition-id="s4" data-composition-src="compositions/s4.html"
           data-start="41.4" data-duration="17.1" data-track-index="1"></div>
      <div id="escena-5" class="clip" data-composition-id="s5" data-composition-src="compositions/s5.html"
           data-start="58.5" data-duration="9.5" data-track-index="1"></div>

      <div id="firma" class="clip" data-start="0" data-duration="68.0" data-track-index="2">JA</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
